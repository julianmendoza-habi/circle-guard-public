apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-promotion-service
  namespace: circleguard-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-promotion-service
  template:
    metadata:
      labels:
        app: circleguard-promotion-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.circleguard-infra.svc.cluster.local -p 5432 -U admin
              do
                echo waiting for postgres
                sleep 2
              done
        - name: wait-for-neo4j
          image: neo4j:5.26
          command:
            - sh
            - -c
            - |
              until cypher-shell -a bolt://neo4j.circleguard-infra.svc.cluster.local:7687 -u neo4j -p password "RETURN 1" >/dev/null 2>&1
              do
                echo waiting for neo4j
                sleep 2
              done
        - name: wait-for-redis
          image: redis:7.2-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis.circleguard-infra.svc.cluster.local ping | grep -q PONG
              do
                echo waiting for redis
                sleep 2
              done
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka.circleguard-infra.svc.cluster.local 9092
              do
                echo waiting for kafka
                sleep 2
              done
      containers:
        - name: promotion
          image: circleguard/promotion-service:dev-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: circleguard-runtime-dev
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.circleguard-infra.svc.cluster.local:5432/circleguard_promotion
            - name: SPRING_DATASOURCE_USERNAME
              value: admin
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circleguard-shared-secret
                  key: datasource-password
            - name: SPRING_DATA_REDIS_HOST
              value: redis.circleguard-infra.svc.cluster.local
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_NEO4J_URI
              value: bolt://neo4j.circleguard-infra.svc.cluster.local:7687
            - name: SPRING_NEO4J_AUTHENTICATION_USERNAME
              value: neo4j
            - name: SPRING_NEO4J_AUTHENTICATION_PASSWORD
              value: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-shared-secret
                  key: jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-promotion-service
  namespace: circleguard-dev
spec:
  selector:
    app: circleguard-promotion-service
  ports:
    - port: 8080
      targetPort: 8080
---
