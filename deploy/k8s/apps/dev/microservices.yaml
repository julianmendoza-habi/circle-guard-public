# Deploy selected CircleGuard microservices into circleguard-dev.
# Prerequisites: namespaces + infra (postgres-redis-neo4j, kafka-zookeeper, openldap).
# Images default to local registry tags — override IMAGE_TAG / REGISTRY in CI (Jenkins).
apiVersion: v1
kind: ConfigMap
metadata:
  name: circleguard-runtime-dev
  namespace: circleguard-dev
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.circleguard-infra.svc.cluster.local:9092
  POSTGRES_HOST: postgres.circleguard-infra.svc.cluster.local
  REDIS_HOST: redis.circleguard-infra.svc.cluster.local
  NEO4J_URI: bolt://neo4j.circleguard-infra.svc.cluster.local:7687
  LDAP_PRIMARY_URL: ldap://openldap.circleguard-infra.svc.cluster.local:389
---
apiVersion: v1
kind: Secret
metadata:
  name: circleguard-shared-secret
  namespace: circleguard-dev
type: Opaque
stringData:
  datasource-password: password
  jwt-secret: my-super-secret-dev-key-32-chars-long-12345678
  qr-secret: my-qr-secret-key-for-dev-1234567890
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-auth-service
  namespace: circleguard-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-auth-service
  template:
    metadata:
      labels:
        app: circleguard-auth-service
    spec:
      containers:
        - name: auth
          image: circleguard/auth-service:dev-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: circleguard-runtime-dev
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres.circleguard-infra.svc.cluster.local:5432/circleguard_auth
            - name: SPRING_DATASOURCE_USERNAME
              value: admin
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: circleguard-shared-secret
                  key: datasource-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-shared-secret
                  key: jwt-secret
            - name: QR_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-shared-secret
                  key: qr-secret
            - name: SPRING_LDAP_URLS
              value: ldap://openldap.circleguard-infra.svc.cluster.local:389
            - name: CIRCLEGUARD_IDENTITY_MAP_URL
              value: http://circleguard-identity-service.circleguard-dev.svc.cluster.local:8080/api/v1/identities/map
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-auth-service
  namespace: circleguard-dev
spec:
  selector:
    app: circleguard-auth-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
