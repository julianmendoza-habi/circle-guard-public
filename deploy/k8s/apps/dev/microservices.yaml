apiVersion: apps/v1
kind: Deployment
metadata:
  name: circleguard-gateway-service
  namespace: circleguard-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circleguard-gateway-service
  template:
    metadata:
      labels:
        app: circleguard-gateway-service
    spec:
      initContainers:
        # Avoid Spring Boot failing Redis handshake while Redis pod is still starting (progress deadline).
        - name: wait-for-redis
          image: redis:7.2-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis.circleguard-infra.svc.cluster.local ping | grep -q PONG
              do
                echo waiting for redis
                sleep 2
              done
      containers:
        - name: gateway
          image: circleguard/gateway-service:dev-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: circleguard-runtime-dev
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATA_REDIS_HOST
              value: redis.circleguard-infra.svc.cluster.local
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-shared-secret
                  key: jwt-secret
            - name: QR_SECRET
              valueFrom:
                secretKeyRef:
                  name: circleguard-shared-secret
                  key: qr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: circleguard-gateway-service
  namespace: circleguard-dev
spec:
  selector:
    app: circleguard-gateway-service
  ports:
    - port: 8080
      targetPort: 8080
