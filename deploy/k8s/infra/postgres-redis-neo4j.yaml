# Minimal middleware for CircleGuard (dev/stage demos). Adjust storage classes for production.
apiVersion: v1
kind: Namespace
metadata:
  name: circleguard-infra
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: circleguard-infra
type: Opaque
stringData:
  username: admin
  password: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: circleguard-infra
data:
  init-databases.sql: |
    CREATE DATABASE circleguard_auth;
    CREATE DATABASE circleguard_identity;
    CREATE DATABASE circleguard_promotion;
    CREATE DATABASE circleguard_form;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: circleguard-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: circleguard
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d/init-databases.sql
              subPath: init-databases.sql
      volumes:
        - name: init
          configMap:
            name: postgres-init-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: circleguard-infra
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: circleguard-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: circleguard-infra
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: circleguard-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              value: neo4j/password
            # Clients connect via the Service DNS name; Bolt must advertise the same host or
            # cypher-shell / drivers fail the handshake after TCP connect.
            - name: NEO4J_server_http_advertised__address
              value: neo4j.circleguard-infra.svc.cluster.local:7474
            - name: NEO4J_server_bolt_advertised__address
              value: neo4j.circleguard-infra.svc.cluster.local:7687
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: circleguard-infra
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
