# Idempotent: creates CircleGuard DBs if missing (init-databases.sql only runs on empty Postgres PVC).
# Apply after postgres Deployment is Ready; safe to re-run every pipeline.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-ensure-databases
  namespace: circleguard-infra
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ensure
          image: postgres:16-alpine
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -h postgres -p 5432; do sleep 2; done
              for db in circleguard_auth circleguard_identity circleguard_promotion circleguard_form
              do
                exists=$(psql -h postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'")
                if [ "$exists" != "1" ]; then
                  echo "CREATE DATABASE ${db}"
                  psql -h postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${db};"
                else
                  echo "database ${db} already exists"
                fi
              done
