# Faster CI/local builds: parallel projects + remote build cache entries (when Jenkins persists ~/.gradle).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
# Jenkins workspaces on mounts: disable native FS watching overhead.
org.gradle.vfs.watch=false
