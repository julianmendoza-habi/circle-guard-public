spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

auth:
  api:
    url: ${AUTH_API_URL:http://localhost:8180}

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000

qr:
  secret: "my-qr-secret-key-for-dev-1234567890"
  expiration: 300

# --- Feature Toggles (per-channel notification switches; default ON / opt-out) ---
# Flip any of these (here, via ConfigMap, or env CIRCLEGUARD_FEATURES_CHANNELS_<CHANNEL>=false)
# to mute a delivery channel without a code change. Bound by NotificationFeatureProperties.
circleguard:
  features:
    channels:
      email: true
      sms: true
      push: true

server:
  port: 8082

# --- Observability (Actuator + Micrometer/Prometheus) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true   # exposes /actuator/health/{liveness,readiness}
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  # Distributed tracing -> OTLP -> Jaeger. Full sampling for the demo; in k8s the endpoint is
  # overridden via the MANAGEMENT_OTLP_TRACING_ENDPOINT env (relaxed binding) from the ConfigMap.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
