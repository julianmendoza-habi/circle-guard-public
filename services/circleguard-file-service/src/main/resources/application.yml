spring:
  application:
    name: circleguard-file-service

# Placeholder for S3/MinIO configuration if needed later
# aws:
#   s3:
#     endpoint: http://localhost:9000
#     access-key: minioadmin
#     secret-key: minioadmin

server:
  port: 8085

# --- Observability (Actuator + Micrometer/Prometheus) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true   # exposes /actuator/health/{liveness,readiness}
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  # Distributed tracing -> OTLP -> Jaeger. Full sampling for the demo; in k8s the endpoint is
  # overridden via the MANAGEMENT_OTLP_TRACING_ENDPOINT env (relaxed binding) from the ConfigMap.
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
