# Jenkins LTS + k3s (Kubernetes en Docker) para pipelines CircleGuard.
#
# Inicio:  docker compose -f docker-compose.jenkins.yml build --no-cache && docker compose -f docker-compose.jenkins.yml up -d
# Si dentro del contenedor `docker` no existe: imagen vieja/caché — vuelve a build desde la raíz del repo (docker/Dockerfile.jenkins).
# Logs:    docker compose -f docker-compose.jenkins.yml logs -f jenkins
# Parada:  docker compose -f docker-compose.jenkins.yml down
# UI:      http://localhost:8080
#
# Requisitos: Docker Desktop (WSL2 en Windows) o Linux con soporte para privileged.
# El servicio `k3s` expone la API en localhost:6443; Jenkins usa el mismo volumen `k3s-etc` (solo lectura)
# para generar /var/jenkins_home/.kube/config apuntando a https://k3s:6443.
#
# Contraseña inicial Jenkins:
#   docker exec circleguard-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
#
# Probar kubectl dentro de Jenkins:
#   docker exec -it circleguard-jenkins kubectl get nodes
#
# Pipeline dev (ci/Jenkinsfile.dev.groovy): si el job Jenkins corre en este host con acceso Docker,
# el stage de deploy puede importar imágenes `circleguard/*:dev-latest` al containerd de k3s usando el
# contenedor `circleguard-k3s`. Para otro nombre: variable de entorno del job `K3S_CONTAINER_NAME`.
#
# E2E (master/stage): no hace falta definir E2E_* en Jenkins. El pipeline ejecuta
# scripts/ci/run-e2e-with-kube-port-forward.sh dentro del contenedor jenkins: abre túneles a los Services
# del namespace y llama a los microservicios en 127.0.0.1:18080–18088 (no usa el puerto 8080 de la UI).

services:
  # Keep in sync with kubectl ARG KUBECTL_VERSION in docker/Dockerfile.jenkins (same Kubernetes minor).
  k3s:
    image: rancher/k3s:v1.28.15-k3s1
    container_name: circleguard-k3s
    # Pin hostname and --node-name so k3s always registers as the SAME Kubernetes node across
    # container recreations. Without this, Docker assigns a fresh container-id hostname on every
    # recreate (rebuild, Docker Desktop restart, `compose up` with changes) and k3s registers a
    # brand-new node, leaving the previous one as an unreachable "ghost" in etcd. Pods bound to
    # the ghost node stay forever (taint is NoSchedule, not NoExecute) and `kubectl rollout
    # status` for postgres/kafka/etc. times out with `0 of 1 updated replicas are available`.
    hostname: circleguard-k3s
    restart: unless-stopped
    privileged: true
    command:
      - server
      - --tls-san=k3s
      - --tls-san=127.0.0.1
      - --disable=traefik
      - --node-name=circleguard-k3s
    environment:
      K3S_TOKEN: circleguard-local-dev
    volumes:
      - k3s-etc:/etc/rancher/k3s
      - k3s-data:/var/lib/rancher/k3s
    ports:
      - "6443:6443"
    networks:
      - circleguard

  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    image: circleguard-jenkins:lts-jdk21-tools
    container_name: circleguard-jenkins
    restart: unless-stopped
    user: "0:0"
    depends_on:
      k3s:
        condition: service_started
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - k3s-etc:/k3s-etc:ro
    environment:
      # Root's default HOME is /root; kubectl looks at $HOME/.kube/config unless KUBECONFIG is set.
      # docker exec often drops inherited env — keep HOME on Jenkins data dir so kubectl finds the same kubeconfig.
      # Force the Linux socket inside this container ( Gradle/Testcontainers must not inherit Windows Docker Desktop env from the host ).
      DOCKER_HOST: unix:///var/run/docker.sock
      HOME: /var/jenkins_home
      TZ: UTC
      KUBECONFIG: /var/jenkins_home/.kube/config
      K3S_API_HOST: k3s
    networks:
      - circleguard

networks:
  circleguard:
    driver: bridge

volumes:
  jenkins_home:
  k3s-etc:
  k3s-data:
