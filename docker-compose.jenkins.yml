# Jenkins LTS (JDK 21) — uso local para CircleGuard.
# Inicio:  docker compose -f docker-compose.jenkins.yml build && docker compose -f docker-compose.jenkins.yml up -d
# Logs:    docker compose -f docker-compose.jenkins.yml logs -f jenkins
# Parada:  docker compose -f docker-compose.jenkins.yml down
# UI:      http://localhost:8080
#
# Contraseña inicial:
#   docker exec circleguard-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
#
# Opcional (Linux / Docker Desktop con socket): descomenta volumes y group_add
# para que los pipelines puedan usar `docker` en el host.

services:
  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    image: circleguard-jenkins:lts-jdk21-tools
    container_name: circleguard-jenkins
    restart: unless-stopped
    # El usuario por defecto es `jenkins` (uid 1000) y no suele pertenecer al grupo del
    # socket Docker del host → Testcontainers falla con DockerClientProviderStrategy.
    # root puede usar el socket montado (solo entorno local; no uses esto en producción).
    user: "0:0"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Testcontainers (-Pintegration) necesita el daemon Docker del host.
      # Alternativa a user root: quitar user y usar group_add + DOCKER_GID (ver ci/README).
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: UTC
      # Evita wizard de plugins en algunos entornos (opcional):
      # JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

volumes:
  jenkins_home:
